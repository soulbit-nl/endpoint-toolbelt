# Dependabot for build and test tooling: the product ships no NuGet package. WiX stays on 5.x
# (5.0.2 is plain MS-RL; later major versions carry another licence).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Only versions released at least two weeks ago: a bad or hijacked release is usually
    # pulled within days.
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: WixToolset.Sdk
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Only versions released at least two weeks ago: a bad or hijacked release is usually
    # pulled within days.
    cooldown:
      default-days: 14
  # Semgrep for CI (build/semgrep-requirements.txt, pinned with hashes): otherwise nothing ever
  # proposes a newer one.
  - package-ecosystem: pip
    directory: /build
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
