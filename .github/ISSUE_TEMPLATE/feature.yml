name: Idea
description: A change or a new action.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Microsoft documentation
      description: Device actions are built only where Microsoft documents the procedure. Link the page if you know it.
