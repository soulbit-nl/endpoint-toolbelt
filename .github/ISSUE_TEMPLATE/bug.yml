name: Bug
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste names of organizations, people, tenants, domains or devices, and never paste log excerpts from a real device. Use Contoso examples (`contoso.example`, `CONTOSO-1111`). A security finding goes through the steps in SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in the About dialog or in Programs and Features.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
